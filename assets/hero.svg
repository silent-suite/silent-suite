  <text class="lbl e in" x="450" y="222" text-anchor="middle" style="--d:1.7s; font-size:9px">ENCRYPT</text>
  <line x1="1" y1="284" x2="899" y2="284" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="24" y="316" class="in" style="--d:4.0s"><tspan class="e">▸</tspan> The server stores ciphertext. The keys stay on your devices.</text>
  <text x="24" y="340" class="in" style="--d:4.3s"><tspan class="m">  Event titles, places, contacts, tasks and notes are encrypted before upload.</tspan></text>
  <text x="24" y="370" class="in" style="--d:4.6s"><tspan class="m">  XChaCha20-Poly1305 · Argon2id · Etebase protocol · open source, AGPL-3.0</tspan></text>
