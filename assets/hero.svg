  <text x="24" y="94" textLength="118" lengthAdjust="spacingAndGlyphs">[<tspan class="e b">you</tspan><tspan class="m">@</tspan><tspan class="e b">phone</tspan> <tspan class="s">~</tspan>]$</text>
  <text x="150" y="94">cat dentist.ics</text>
  <rect class="wipe" x="149" y="80" width="130" height="19" fill="#0A1018" style="animation-duration:0.6s; animation-timing-function:steps(15); animation-delay:0.3s"/>
  <text x="24" y="122" class="in" style="--d:1.0s"><tspan class="m">BEGIN:</tspan>VEVENT</text>
  <text x="24" y="144" class="in" style="--d:1.1s"><tspan class="m">SUMMARY:</tspan>Dentist, Dr. Weber</text>
  <text x="24" y="166" class="in" style="--d:1.2s"><tspan class="m">DTSTART:</tspan>20261119T093000</text>
