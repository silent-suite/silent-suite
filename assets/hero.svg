  <text x="24" y="210" class="in" style="--d:1.4s"><tspan class="m">DESCRIPTION:</tspan>Bring the x-rays</text>
  <text x="24" y="232" class="in" style="--d:1.5s"><tspan class="m">END:</tspan>VEVENT</text>
  <text x="474" y="94" class="in" style="--d:2.4s" textLength="135" lengthAdjust="spacingAndGlyphs">[<tspan class="e b">root</tspan><tspan class="m">@</tspan><tspan class="e b">server</tspan> <tspan class="s">~</tspan>]$</text>
  <text x="617" y="94">xxd event.bin</text>
