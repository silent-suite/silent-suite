  <text x="474" y="210" class="in" style="--d:3.52s"><tspan class="m">0040:</tspan> <tspan class="s">6cad 0f21 d3ac 90c1 1fb1 f28c</tspan></text>
  <text x="474" y="232" class="in" style="--d:3.60s"><tspan class="m">0050:</tspan> <tspan class="s">3926 a170 a09f 953f f29d 0fd6</tspan></text>
  <text x="474" y="254" class="in" style="--d:3.68s"><tspan class="m">0060:</tspan> <tspan class="s">93bd 95e6 658c 0cb1 f9eb 3898</tspan></text>
