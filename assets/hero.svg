  <style>
    text { font-family: Hack, 'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 14px; fill: #d6dee8; white-space: pre; }
    .m { fill: #6b7a8c; } .e { fill: #34d399; } .s { fill: #8a99ab; } .b { font-weight: 700; }
    .ui { font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #9fb0c3; }
    .lbl { font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .in { animation: in .35s ease-out var(--d, 0s) both; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    .wipe { transform-box: fill-box; transform-origin: right; animation-name: wipe; animation-fill-mode: both; }
    @keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .spin { animation: spin .9s ease-in-out 1.7s 2 both; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .ring { animation: glow 2.4s ease-in-out 1.7s infinite; }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    .cur { animation: in .1s 5.2s both, blink 1s steps(1) 5.3s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .spin, .ring, .cur { animation: none; } .wipe { display: none; } }
  </style>
