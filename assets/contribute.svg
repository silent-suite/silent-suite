  <style>
    text { font-family: Hack, 'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 14px; fill: #d6dee8; white-space: pre; }
    .m { fill: #6b7a8c; } .e { fill: #34d399; } .s { fill: #8a99ab; } .b { font-weight: 700; }
    .ui { font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #9fb0c3; }
    .lbl { font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .in { animation: in .35s ease-out var(--d, 0s) both; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    .go { animation: go 1.6s ease-in-out infinite; }
    @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    .btn { animation: glow 2.4s ease-in-out infinite; }
